[project]
name = "clinical-ai-guardrails"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "valavanca", email = "valavanca@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.1",
    "xgboost>=3.0.2",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.2",
    "pypalettes>=0.1.6",
    "smolagents[litellm]>=1.20.0",
    "gradio>=5.38.1",
    "ddgs>=9.5.2",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "weave>=0.51.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.0.0",
    "pytest>=7.0.0",
]
